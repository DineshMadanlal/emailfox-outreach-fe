<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EmailFox SSO Test Parent</title>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    .header {
      padding: 16px;
      background: #222;
      color: white;
    }

    iframe {
      width: 100%;
      height: calc(100vh - 60px);
      border: none;
    }

    pre {
      background: #eee;
      padding: 10px;
      overflow: auto;
    }
  </style>
</head>
<body>

<div class="header">
  <h2>EmailFox Parent Test Page</h2>
  <div id="status">Waiting for iframe...</div>
</div>

<iframe
  id="emailfox"
  src="http://acme-marketing.app.skysenders.local:8080">
</iframe>

<script>
const iframe = document.getElementById("emailfox");
const status = document.getElementById("status");

// Fake JWT for testing
const fakeToken =
  "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.fake.payload.signature";

window.addEventListener("message", async (event) => {
  console.log("Received:", event);

  if (event.data?.type !== "EMAILFOX_READY") {
    return;
  }

  status.innerText = "Iframe is ready.";

  console.log("EmailFox READY received.");

  // Simulate backend delay
  await new Promise(resolve => setTimeout(resolve, 1000));

  console.log("Sending fake SSO token...");

  event.source.postMessage(
    {
      type: "EMAILFOX_SSO",
      token: fakeToken
    },
    event.origin
  );

  status.innerText = "Token sent!";
});
</script>

</body>
</html>
